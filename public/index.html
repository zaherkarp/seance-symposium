    function renderMarkdown(text) {
      if (!text) return { __html: '' };
      try {
        return { __html: marked.parse(text, { breaks: true }) };
      } catch (err) {
        return { __html: text.replace(/</g, '&lt;') };

    // ---- Symposium presentation data derivation ----
    const PANELS = [
      { name: 'I · Minimalism vs. Narrative', pair: ['tufte', 'rosling'],
        q: 'How can we tell a clear story without unnecessary decoration?' },
      { name: 'II · Rigor vs. Expressiveness', pair: ['bertin', 'posavec'],

      { name: 'III · Data Structure vs. Human Feeling', pair: ['hadley', 'lupi'],

      { name: 'V · Control vs. Exploration', pair: ['shneiderman', 'bostock'],
        q: 'How can users explore without getting lost?' },
      { name: 'VI · Open Science vs. Excellence', pair: ['chamberlain', 'wilke'],
        q: 'How do we balance openness with excellence?' },
      { name: 'Editorial · Reportage vs. Reduction', pair: ['cox', 'tufte'],
        q: 'When does clarity require restraint vs. context?' },
    ];

    const PHILOSOPHY_SHORT = {
      tufte: 'Remove all non-essential ink.',
      rosling: 'Engage audiences through story.',
      bertin: 'Semiotic correctness & visual grammar.',
      few: 'Business ROI & maintainability.',
      shneiderman: 'User agency & direct manipulation.',
      norman: 'Match the user\'s mental model.',
      maeda: 'Beauty through clarity and computation.',
      lupi: 'Data humanism & empathetic annotation.',
      felton: 'Personal data, longitudinal craft.',
      krug: 'Don\'t make me think.',
      posavec: 'Handcrafted, personal expression.',
      stefaner: 'Perceptual systems, exploratory rigor.',
      bremer: 'Beautiful and rigorous storytelling.',
      cox: 'Editorial clarity, reader first.',
      bostock: 'Web-native, expressive code.',
      vinh: 'Strong systems, polished hierarchy.',
      hadley: 'Tidy data, grammar-of-graphics.',
      bryan: 'Reproducible, collaborative workflows.',
      yihui: 'Literate documents, dynamic reporting.',

      knaflic: 'One message, no clutter.',
      muth: 'Color, type, axis, label — reasoned out.',
      munzner: 'Name the task, justify the encoding.',

      inclusive: 'Accessibility for all users.',
    };

    function extractPullQuote(evaluation) {
      const raw = (evaluation && (evaluation.response || evaluation.parsed?.raw)) || '';
      if (!raw) return evaluation?.parsed?.summary || '(no critique surfaced)';
      const paragraphs = raw.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
      for (const p of paragraphs) {
        if (/^#{1,6}\s/.test(p)) continue;
        if (/^SCORES?\s*:/i.test(p)) break;
        if (/^PROPOSALS?\s*:/i.test(p)) break;
        if (/^---+\s*$/.test(p)) continue;
        if (/^\*\*\d+\.\s/.test(p)) continue;
        if (/^\d+\.\s+\*\*/.test(p)) continue;
        const cleaned = p
          .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
          .replace(/[*_`]/g, '')
          .replace(/\s+/g, ' ')
          .trim();
        if (cleaned.length < 60) continue;
        const sentences = cleaned.match(/[^.!?]+[.!?]+/g) || [cleaned];
        let result = sentences.slice(0, 2).join(' ').trim();
        if (result.length > 280) result = result.slice(0, 277) + '…';
        return result;
      }
      const fallback = (evaluation.parsed?.summary || '').replace(/[*_`#]/g, '').trim();
      return fallback || '(no critique surfaced)';
    }

    function agentScores(evaluation) {
      const arr = (evaluation?.parsed?.scores || [])
        .map((s) => Number(s.score))
        .filter((n) => !Number.isNaN(n));
      return arr;
    }

    function agentComposite(evaluation) {
      const arr = agentScores(evaluation);
      if (!arr.length) return null;
      const sum = arr.reduce((a, b) => a + b, 0);
      // 5 dims per agent in this app -> /50. If fewer present, scale.
      return Math.round((sum / arr.length) * 5);
    }

    function agentEnriched(evaluation) {
      const meta = AGENTS.find((a) => a.id === evaluation.agentId) || {
        id: evaluation.agentId, name: evaluation.name, icon: '❔', philosophy: '',
      };
      const composite = agentComposite(evaluation);
      const scores = agentScores(evaluation);
      const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
      return {
        id: meta.id,
        name: meta.name,
        icon: meta.icon,
        philosophy: PHILOSOPHY_SHORT[meta.id] || meta.philosophy || '',
        quote: extractPullQuote(evaluation),
        score: composite,
        scoreMax: 50,
        avg,
      };
    }

    function firstSentence(text) {
      if (!text) return '';
      const cleaned = String(text).replace(/[*_`]/g, '').replace(/\s+/g, ' ').trim();
      const m = cleaned.match(/[^.!?]+[.!?]/);
      const out = (m ? m[0] : cleaned).trim();
      return out.length > 220 ? out.slice(0, 217) + '…' : out;
    }

    function derivePresentationData(evaluations, report, opts = {}) {
      const presentations = Array.isArray(opts.presentations) ? opts.presentations : [];
      const enriched = {};
      const avgs = [];
      evaluations.forEach((e) => {
        if (!e || e.error) return;
        const ag = agentEnriched(e);
        enriched[e.agentId] = ag;
        if (ag.avg !== null) avgs.push(ag.avg);
      });

      const overallAvg = avgs.length ? avgs.reduce((a, b) => a + b, 0) / avgs.length : 0;
      const composite = Math.round(overallAvg * 5);

      // Lead quote: harshest critic's pull-quote
      const harshest = Object.values(enriched)
        .filter((e) => e.avg !== null)
        .sort((a, b) => a.avg - b.avg)[0];
      const leadQuote = (harshest && harshest.quote) || 'The verdict is in.';

      // Debates: prefer canonical panels where both agents present, then fill with
      // biggest deltas between unused agents.
      const debates = [];
      const used = new Set();
      PANELS.forEach((p) => {
        if (debates.length >= 3) return;
        const L = enriched[p.pair[0]];
        const R = enriched[p.pair[1]];
        if (!L || !R) return;
        if (used.has(L.id) || used.has(R.id)) return;
        debates.push({
          panel: p.name,
          left: L,
          right: R,
          consensusQ: p.q,
        });
        used.add(L.id); used.add(R.id);
      });

      if (debates.length < 3) {
        const remaining = Object.values(enriched)
          .filter((e) => !used.has(e.id) && e.avg !== null)
          .sort((a, b) => a.avg - b.avg);
        while (debates.length < 3 && remaining.length >= 2) {
          const low = remaining.shift();
          const high = remaining.pop();
          debates.push({
            panel: `Improvised · ${low.name} vs ${high.name}`,
            left: low,
            right: high,
            consensusQ: 'Where do these voices converge?',
          });
        }
      }

      const topProposals = (report?.topRecommendations || [])
        .slice(0, 3)
        .map((r, i) => {
          const backers = [];
          evaluations.forEach((e) => {
            const props = e?.parsed?.improvements || [];
            if (props.some((p) => p && p.trim() === r.proposal)) {
              const meta = AGENTS.find((a) => a.id === e.agentId);
              if (meta) backers.push({ id: meta.id, name: meta.name.split(' ').slice(-1)[0] });
            }
          });
          return {
            rank: i + 1,
            votes: Math.round(r.score || 0),
            text: (r.proposal || '').replace(/[*_`]/g, '').trim(),
            backers,
          };
        })
        .filter((p) => p.text && p.text.length > 8);

      const conflicts = (report?.conflictPairs || [])
        .slice(0, 4)
        .map((p) => {
          const A = AGENTS.find((a) => a.id === p.agentA);
          const B = AGENTS.find((a) => a.id === p.agentB);
          return {
            left:  { id: A?.id || p.agentA, name: A ? A.name.split(' ').slice(-1)[0] : p.agentA, role: A?.philosophy?.split(/[,.]/)[0] || '' },
            right: { id: B?.id || p.agentB, name: B ? B.name.split(' ').slice(-1)[0] : p.agentB, role: B?.philosophy?.split(/[,.]/)[0] || '' },
            delta: Number(p.delta).toFixed(1),
          };
        });

      const roster = evaluations
        .filter((e) => !e.error)
        .map((e) => {
          const meta = AGENTS.find((a) => a.id === e.agentId) || { id: e.agentId, name: e.name, icon: '❔' };
          return {
            id: meta.id,
            icon: meta.icon,
            name: meta.name.split(' ').slice(-1)[0],
            score: agentComposite(e),
          };
        });

      const groupSummaries = presentations
        .filter((p) => p && !p.error && p.sections?.abstract)
        .map((p) => ({
          id: p.disciplineId,
          icon: p.icon || '🎓',
          name: (p.name || '').replace(/\s+Group$/i, ''),
          discipline: p.discipline || '',
          take: firstSentence(p.sections.abstract),
        }));

      const synthesisActions = (report?.topRecommendations || [])
        .slice(0, 4)
        .map((r) => (r.proposal || '').replace(/[*_`]/g, '').trim())
        .filter(Boolean);
      const synthTitle = synthesisActions.length
        ? synthesisActions[0].length > 80 ? synthesisActions[0].slice(0, 77) + '…' : synthesisActions[0]
        : 'The Symposium adjourns.';

      return {
        target: opts.target || '',
        composite,
        compositeMax: 50,
        leadQuote,
        meta: {
          agents: evaluations.length,
          conflicts: (report?.conflictPairs || []).length,
          proposals: (report?.topRecommendations || []).length,
        },
        roster,
        debates,
        topProposals,
        conflicts,
        groupSummaries,
        synthesis: {
          title: synthTitle,
          actions: synthesisActions,
        },
        links: {
          source: opts.target && /^https?:\/\//.test(opts.target) ? opts.target : '',
          deliberation: opts.deliberationUrl || '',
        },
      };
    }

    function launchSymposium(evaluations, report, target, presentations) {
      const data = derivePresentationData(evaluations, report, {
        target,
        presentations,
        deliberationUrl: window.location.origin + '/',
      });
      try {
        localStorage.setItem('symposium-data', JSON.stringify(data));
      } catch (err) {
        console.warn('Could not persist symposium data:', err);
      }
      window.open('/symposium-presentation.html', '_blank', 'noopener');
    }

    function presentationToMarkdown(presentation) {
      const lines = [];
      lines.push(`# ${presentation.name} — Semester Review`);
      lines.push('');
      lines.push(`*Discipline: ${presentation.discipline || ''}*`);
      lines.push('');
      SECTION_DEFS.forEach((section) => {
        const body = presentation.sections?.[section.key];
        if (!body) return;
        lines.push(`## ${section.label}`);
        lines.push('');
        lines.push(body.trim());
        lines.push('');
      });
      return lines.join('\n');
    }

    function downloadFile(filename, content, mime = 'text/markdown') {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    }

    async function downloadPresentationsZip(presentations) {
      const zip = new JSZip();
      presentations.forEach((p) => {
        const filename = `${p.disciplineId || p.discipline || 'group'}-presentation.md`;
        zip.file(filename, presentationToMarkdown(p));
      });
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'design-review-presentations.zip';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    }

    function DesignReviewApp() {
      const [step, setStep] = useState('input');
      const [inputType, setInputType] = useState(null);
      const [designBrief, setDesignBrief] = useState('');
      const [imageUrls, setImageUrls] = useState('');
      const [repoUrl, setRepoUrl] = useState('');
      const [repoDepth, setRepoDepth] = useState('');
      const [includeSynthesis, setIncludeSynthesis] = useState(true);

      const [evaluations, setEvaluations] = useState([]);
      const [report, setReport] = useState(null);
      const [presentations, setPresentations] = useState(null);
      const [activeTab, setActiveTab] = useState(null);
      const [showRawData, setShowRawData] = useState(false);
      const [error, setError] = useState('');
      const [statusMessage, setStatusMessage] = useState('');

      const buildContext = () => {
        let context = '';
        if (designBrief) context += `DESIGN BRIEF:\n${designBrief}\n\n`;
        if (imageUrls) context += `IMAGE URLS:\n${imageUrls}\n\n`;
        if (repoUrl) context += `REPOSITORY:\n${repoUrl}\nANALYSIS DEPTH: ${repoDepth || 'sample'}\n\n`;
        return context || '(No design context provided)';
      };

      const resetResultsState = () => {
        setEvaluations([]);
        setReport(null);
        setPresentations(null);
        setActiveTab(null);
        setShowRawData(false);
      };

      const showResults = (data) => {
        setEvaluations(data.evaluations || []);
        setReport(data.report || null);
        if (Array.isArray(data.presentations) && data.presentations.length) {
          setPresentations(data.presentations);
          setActiveTab(data.presentations[0].disciplineId);
        } else {
          setPresentations(null);
          setActiveTab(null);
        }
        setStep('results');
      };

      const runEvaluation = async () => {
        if (!designBrief && !imageUrls && !repoUrl) {
          setError('Please provide at least one input: text brief, image URLs, or repo');
          return;
        }
        setError('');
        resetResultsState();
        setStatusMessage(includeSynthesis ? 'Running critics, then grad-student groups…' : 'Running critics in parallel…');
        setStep('evaluating');
        try {
          const response = await fetch('/api/evaluate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              context: buildContext(),
              repoUrl: repoUrl || '',
              repoDepth: repoDepth || 'sample',
              includeSynthesis,
            }),
          });
          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.error || 'Evaluation failed');
          }
          const data = await response.json();
          showResults(data);
        } catch (err) {
          setError(err.message);
          setStep('input');
        }
      };

      const runFixtureSynthesis = async () => {
        setError('');
        resetResultsState();
        setStatusMessage('Loading fixture and running grad-student groups…');
        setStep('evaluating');
        try {
          const fixtureResp = await fetch('/api/fixture');
          if (!fixtureResp.ok) {
            const data = await fixtureResp.json().catch(() => ({}));
            throw new Error(data.error || 'Fixture not found');
          }
          const fixture = await fixtureResp.json();
          const synthResp = await fetch('/api/synthesize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ useFixture: true }),
          });
          if (!synthResp.ok) {
            const data = await synthResp.json();
            throw new Error(data.error || 'Synthesis failed');
          }
          const synth = await synthResp.json();
          showResults({
            evaluations: fixture.evaluations || [],
            report: fixture.report || null,
            presentations: synth.presentations || [],
          });
        } catch (err) {
          setError(err.message);
          setStep('input');
        }
      };

      const newEvaluation = () => {
        setStep('input');
        setDesignBrief('');
        setImageUrls('');
        setRepoUrl('');
        setRepoDepth('');
        resetResultsState();
        setError('');
      };

      // ---- INPUT STEP ----
      if (step === 'input') {
        return (
          <div style={{ minHeight: '100vh', padding: '40px 20px' }}>
            <div style={{ maxWidth: '900px', margin: '0 auto' }}>
              <h1 style={{ fontSize: '36px', fontWeight: 300, margin: '0 0 8px 0', letterSpacing: '-0.5px' }}>
                Seance Symposium
              </h1>
              <p style={{ fontSize: '14px', color: '#999', margin: '0 0 32px 0' }}>
                A spectrum of visualization and web design critics evaluate your work. Disciplinary groups then synthesize the findings into site-focused presentations.
              </p>

              {error && (
                <div style={{
                  marginBottom: '24px', padding: '12px', background: '#3d1515',
                  border: '1px solid #d4504f', borderRadius: '6px', fontSize: '13px', color: '#ff9999',
                }}>
                  {error}
                </div>
              )}

              <div style={{ marginBottom: '24px' }}>
                <p style={{ fontSize: '13px', fontWeight: 600, color: '#ccc', margin: '0 0 12px 0' }}>What are you designing?</p>
                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                  {[
                    { type: 'text', label: '📝 Text Brief' },
                    { type: 'image', label: '🖼️ Screenshots/Mockups' },
                    { type: 'repo', label: '🔗 Git Repository' },
                  ].map(item => (
                    <button
                      key={item.type}
                      onClick={() => setInputType(inputType === item.type ? null : item.type)}
                      style={{
                        padding: '8px 12px',
                        background: inputType === item.type ? '#d4504f' : '#333',
                        color: '#fff', border: 'none', borderRadius: '4px',
                        cursor: 'pointer', fontSize: '13px', fontWeight: 500,
                      }}
                    >{item.label}</button>
                  ))}
                </div>
              </div>

              {inputType === 'text' && (
                <textarea
                  placeholder="Describe the design brief, its purpose, target audience, constraints, goals…"
                  value={designBrief}
                  onChange={(e) => setDesignBrief(e.target.value)}
                  style={{ width: '100%', height: '140px', marginBottom: '16px' }}
                />
              )}

              {inputType === 'image' && (
                <input
                  type="text"
                  placeholder="https://example.com/image1.png, https://example.com/image2.png"
                  value={imageUrls}
                  onChange={(e) => setImageUrls(e.target.value)}
                  style={{ width: '100%', marginBottom: '16px' }}
                />
              )}

              {inputType === 'repo' && (
                <>
                  <input
                    type="text"
                    placeholder="https://github.com/user/repo"
                    value={repoUrl}
                    onChange={(e) => setRepoUrl(e.target.value)}
                    style={{ width: '100%', marginBottom: '12px' }}
                  />
                  <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
                    {[
                      { depth: 'sample', label: '📋 Sample' },
                      { depth: 'full', label: '🔍 Full' },
                    ].map(item => (
                      <button
                        key={item.depth}
                        onClick={() => setRepoDepth(repoDepth === item.depth ? '' : item.depth)}
                        style={{
                          flex: 1, padding: '8px 12px',
                          background: repoDepth === item.depth ? '#27ae60' : '#333',
                          color: '#fff', border: 'none', borderRadius: '4px',
                          cursor: 'pointer', fontSize: '12px',
                        }}
                      >{item.label}</button>
                    ))}
                  </div>
                </>
              )}

              <label style={{
                display: 'flex', alignItems: 'center', gap: '10px',
                padding: '12px', background: '#1a1a1a', border: '1px solid #333',
                borderRadius: '6px', marginBottom: '16px', cursor: 'pointer',
              }}>
                <input
                  type="checkbox"
                  checked={includeSynthesis}
                  onChange={(e) => setIncludeSynthesis(e.target.checked)}
                  style={{ width: '16px', height: '16px' }}
                />
                <div>
                  <div style={{ fontSize: '13px', fontWeight: 600 }}>Run grad-student synthesis</div>
                  <div style={{ fontSize: '11px', color: '#999', marginTop: '2px' }}>
                    After the critics finish, discipline groups produce semester-style presentations from multiple design and critique traditions. Adds ~30–60s.
                  </div>
                </div>
              </label>

              <button
                onClick={runEvaluation}
                disabled={!designBrief && !imageUrls && !repoUrl}
                style={{
                  width: '100%', padding: '14px',
                  background: designBrief || imageUrls || repoUrl ? '#d4504f' : '#666',
                  fontSize: '14px', fontWeight: 600,
                  cursor: designBrief || imageUrls || repoUrl ? 'pointer' : 'not-allowed',
                  marginBottom: '12px',
                }}
              >▶️ Run Evaluation</button>

              <button
                onClick={runFixtureSynthesis}
                style={{
                  width: '100%', padding: '12px',
                  background: '#2a2a2a', color: '#ccc',
                  border: '1px dashed #555', fontSize: '12px', fontWeight: 500,
                }}
              >🧪 Synthesize from fixture (skip critics)</button>
              <div style={{ fontSize: '11px', color: '#666', marginTop: '6px', textAlign: 'center' }}>
                Uses design-review-evaluation.json on disk. Useful for iterating on the synthesis prompts.
              </div>
            </div>
          </div>
        );
      }

      // ---- EVALUATING STEP ----
      if (step === 'evaluating') {
        return (
          <div style={{
            minHeight: '100vh', display: 'flex',
            alignItems: 'center', justifyContent: 'center',
          }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '48px', marginBottom: '16px', animation: 'spin 2s linear infinite' }}>🔄</div>
              <h2 style={{ margin: '0 0 8px 0', fontSize: '20px' }}>Evaluating…</h2>
              <p style={{ margin: 0, fontSize: '13px', color: '#999' }}>{statusMessage}</p>
            </div>
          </div>
        );
      }

      // ---- RESULTS STEP ----
      return (
        <div style={{ minHeight: '100vh', padding: '40px 20px' }}>
          <div style={{ maxWidth: '1200px', margin: '0 auto' }}>
            <div style={{ marginBottom: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px' }}>
              <div>
                <h1 style={{ margin: 0, fontSize: '28px', fontWeight: 300 }}>Evaluation Results</h1>
                <p style={{ margin: '8px 0 0 0', fontSize: '13px', color: '#999' }}>
                  {presentations
                    ? `${presentations.length} discipline presentations · ${evaluations.length} critic evaluations`
                    : `${evaluations.length} critic evaluations`}
                </p>
              </div>
              <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', justifyContent: 'flex-end' }}>
                <button
                  onClick={() => launchSymposium(evaluations, report, repoUrl || (designBrief ? designBrief.slice(0, 60) : '') || imageUrls, presentations)}
                  disabled={!evaluations.length}
                  style={{
                    padding: '10px 16px',
                    background: evaluations.length ? '#7d4ad4' : '#444',
                    color: '#fff', fontSize: '13px', fontWeight: 600,
                    cursor: evaluations.length ? 'pointer' : 'not-allowed',
                  }}
                  title="Open the auto-playing curated presentation in a new tab"
                >🎭 Play Symposium Presentation</button>
                <button onClick={newEvaluation} style={{
                  padding: '8px 16px', background: '#333', color: '#e0e0e0',
                  fontSize: '12px',
                }}>↻ New Evaluation</button>
              </div>
            </div>

            {presentations
              ? <PresentationView
                  presentations={presentations}
                  activeTab={activeTab}
                  setActiveTab={setActiveTab}
                  showRawData={showRawData}
                  setShowRawData={setShowRawData}
                  evaluations={evaluations}
                  report={report}
                />
              : <RawDataView evaluations={evaluations} report={report} />
            }
          </div>
        </div>
      );
    }

    function PresentationView({ presentations, activeTab, setActiveTab, showRawData, setShowRawData, evaluations, report }) {
      const active = presentations.find((p) => p.disciplineId === activeTab) || presentations[0];

      return (
        <>
          <div style={{
            display: 'flex', gap: '4px', marginBottom: '24px',
            flexWrap: 'wrap', borderBottom: '1px solid #333', paddingBottom: '12px',
          }}>
            {presentations.map((p) => {
              const isActive = p.disciplineId === active.disciplineId;
              return (
                <button
                  key={p.disciplineId}
                  onClick={() => setActiveTab(p.disciplineId)}
                  style={{
                    padding: '10px 14px',
                    background: isActive ? '#d4504f' : '#1a1a1a',
                    color: isActive ? '#fff' : '#bbb',
                    border: isActive ? '1px solid #d4504f' : '1px solid #333',
                    fontSize: '13px',
                    fontWeight: isActive ? 600 : 500,
                  }}
                >{p.icon} {p.name.replace(' Group', '')}</button>
              );
            })}
          </div>

          {active && <PresentationCard presentation={active} allPresentations={presentations} />}

          <div style={{ marginTop: '32px', borderTop: '1px solid #333', paddingTop: '20px' }}>
            <button
              onClick={() => setShowRawData(!showRawData)}
              style={{
                background: '#1a1a1a', color: '#999', border: '1px solid #333',
                fontSize: '12px', fontWeight: 500, padding: '8px 14px',
              }}
            >
              {showRawData ? '▼' : '▶'} Raw critic data ({evaluations.length} scorecards, ranked-choice voting, conflict map)
            </button>
            {showRawData && (
              <div style={{ marginTop: '20px' }}>
                <RawDataView evaluations={evaluations} report={report} />
              </div>
            )}
          </div>
        </>
      );
    }

    function PresentationCard({ presentation, allPresentations }) {
      const [copyState, setCopyState] = useState('');
      const markdown = useMemo(() => presentationToMarkdown(presentation), [presentation]);
      const hasError = !!presentation.error;

      const copyMarkdown = async () => {
        try {
          await navigator.clipboard.writeText(markdown);
          setCopyState('copied');
          setTimeout(() => setCopyState(''), 1500);
        } catch (err) {
          setCopyState('failed');
          setTimeout(() => setCopyState(''), 1500);
        }
      };

      const downloadMarkdown = () => {
        downloadFile(`${presentation.disciplineId}-presentation.md`, markdown);
      };

      const downloadAll = () => {
        downloadPresentationsZip(allPresentations).catch((err) => {
          console.error('ZIP export failed', err);
        });
      };

      return (
        <div style={{ background: '#141414', border: '1px solid #2a2a2a', borderRadius: '10px', padding: '28px' }}>
          <div style={{
            display: 'flex', justifyContent: 'space-between',
            alignItems: 'flex-start', gap: '16px', marginBottom: '24px',
            paddingBottom: '20px', borderBottom: '1px solid #2a2a2a',
          }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>
                <span style={{ fontSize: '28px' }}>{presentation.icon}</span>
                <h2 style={{ fontSize: '22px', fontWeight: 600, margin: 0 }}>{presentation.name}</h2>
              </div>
              <div style={{ fontSize: '12px', color: '#999' }}>
                Semester project · {presentation.discipline}
              </div>
            </div>
            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
              <button
                onClick={copyMarkdown}
                style={{ padding: '8px 12px', background: '#2a7ae2', fontSize: '12px' }}
              >
                {copyState === 'copied' ? '✓ Copied' : copyState === 'failed' ? '✗ Failed' : '📋 Copy markdown'}
              </button>
              <button
                onClick={downloadMarkdown}
                style={{ padding: '8px 12px', background: '#27ae60', fontSize: '12px' }}
              >💾 .md</button>
              <button
                onClick={downloadAll}
                style={{ padding: '8px 12px', background: '#7d4ad4', fontSize: '12px' }}
              >📦 Download all (ZIP)</button>
            </div>
          </div>

          {hasError && (
            <div style={{
              padding: '12px', background: '#3d1515', border: '1px solid #d4504f',
              borderRadius: '6px', color: '#ff9999', fontSize: '13px', marginBottom: '16px',
            }}>⚠️ {presentation.error}</div>
          )}

          {SECTION_DEFS.map((section) => {
            const body = presentation.sections?.[section.key];
            return (
              <div key={section.key} style={{ marginBottom: '24px' }}>
                <h3 style={{
                  fontSize: '14px', textTransform: 'uppercase', letterSpacing: '1px',
                  color: '#d4504f', margin: '0 0 10px 0', display: 'flex', alignItems: 'center', gap: '8px',
                }}>
                  <span>{section.icon}</span> {section.label}
                </h3>
                {body
                  ? <div className="markdown-body" dangerouslySetInnerHTML={renderMarkdown(body)} />
                  : <div style={{ fontSize: '13px', color: '#666', fontStyle: 'italic' }}>
                      (Section missing from this group's presentation.)
                    </div>
                }
              </div>
            );
          })}

          <details style={{
            marginTop: '24px', padding: '12px', background: '#0a0a0a',
            border: '1px solid #2a2a2a', borderRadius: '6px',
          }}>
            <summary style={{ fontSize: '12px', color: '#888', cursor: 'pointer', userSelect: 'none' }}>
              Show raw model output
            </summary>
            <pre style={{
              marginTop: '12px', whiteSpace: 'pre-wrap', fontSize: '11px',
              lineHeight: 1.5, color: '#aaa', fontFamily: 'monospace',
            }}>{presentation.response || '(no output)'}</pre>
          </details>
        </div>
      );
    }

    function RawDataView({ evaluations, report }) {
      const [showConflictMap, setShowConflictMap] = useState(false);
      const [showDeliberation, setShowDeliberation] = useState(false);

      const rankedProposals = report?.topRecommendations || [];

      const conflictData = (report?.conflictPairs || []).map((pair) => ({
        agent1: AGENTS.find((a) => a.id === pair.agentA),
        agent2: AGENTS.find((a) => a.id === pair.agentB),
        delta: pair.delta != null ? Number(pair.delta).toFixed(1) : 'N/A',
      })).filter((c) => c.agent1 && c.agent2);

      return (
        <>
          {report && (
            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '16px' }}>
              <button
                onClick={() => { if (report.iterationPrompt) navigator.clipboard.writeText(report.iterationPrompt); }}
                style={{ padding: '8px 12px', background: '#2a7ae2', fontSize: '12px' }}
              >📋 Copy Iteration Prompt</button>
              <button
                onClick={() => setShowDeliberation(!showDeliberation)}
                style={{ padding: '8px 12px', background: showDeliberation ? '#d4504f' : '#333', fontSize: '12px' }}
              >{showDeliberation ? '✓' : ''} Deliberation</button>
              <button
                onClick={() => setShowConflictMap(!showConflictMap)}
                style={{ padding: '8px 12px', background: showConflictMap ? '#d4504f' : '#333', fontSize: '12px' }}
              >{showConflictMap ? '✓' : ''} Conflict Map</button>
            </div>
          )}

          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))',
            gap: '16px', marginBottom: '32px',
          }}>
            {evaluations.map((e) => {
              const agent = AGENTS.find((a) => a.id === e.agentId) || { name: e.name, icon: '❔', philosophy: '' };
              const scores = (e.parsed?.scores || []).map((s) => Number(s.score)).filter((n) => !Number.isNaN(n));
              const avgScore = scores.length > 0 ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : 'N/A';
              const proposals = e.parsed?.improvements || [];
              const summary = e.parsed?.summary || '';
              return (
                <div key={e.agentId} style={{
                  background: '#1a1a1a', border: '1px solid #333',
                  borderRadius: '8px', padding: '20px',
                }}>
                  <div style={{ display: 'flex', gap: '12px', marginBottom: '16px', alignItems: 'center' }}>
                    <div style={{ fontSize: '32px' }}>{agent.icon}</div>
                    <div>
                      <h3 style={{ margin: 0, fontSize: '15px', fontWeight: 600 }}>{agent.name}</h3>
                      <p style={{ margin: '4px 0 0 0', fontSize: '12px', color: '#999' }}>{agent.philosophy}</p>
                    </div>
                  </div>
                  {e.error ? (
                    <div style={{ fontSize: '12px', color: '#d4504f' }}>⚠️ {e.error}</div>
                  ) : (
                    <>
                      <div style={{
                        background: '#0f0f0f', padding: '12px',
                        borderRadius: '4px', marginBottom: '12px', textAlign: 'center',
                      }}>
                        <div style={{ fontSize: '11px', color: '#999', marginBottom: '4px' }}>Average Score</div>
                        <div style={{ fontSize: '24px', fontWeight: 600, color: '#d4504f' }}>{avgScore}/10</div>
                      </div>
                      {summary && (
                        <div style={{ fontSize: '12px', color: '#ccc', marginBottom: '12px' }}>
                          <div style={{ fontWeight: 600, marginBottom: '6px', color: '#e0e0e0' }}>Summary</div>
                          <div style={{ lineHeight: 1.5 }}>{summary}</div>
                        </div>
                      )}
                      <div style={{ fontSize: '12px', color: '#ccc' }}>
                        <div style={{ fontWeight: 600, marginBottom: '8px', color: '#e0e0e0' }}>Top Proposals</div>
                        {proposals.length === 0 && (
                          <div style={{ color: '#777', fontStyle: 'italic' }}>(none parsed)</div>
                        )}
                        {proposals.slice(0, 3).map((p, idx) => (
                          <div key={idx} style={{ marginBottom: '8px', lineHeight: 1.4 }}>
                            <span style={{ color: '#d4504f', fontWeight: 500 }}>#{idx + 1}</span> {p}
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              );
            })}
          </div>

          {rankedProposals.length > 0 && (
            <div style={{
              background: '#1a1a1a', border: '1px solid #333',
              borderRadius: '8px', padding: '24px', marginBottom: '24px',
            }}>
              <h2 style={{ margin: '0 0 16px 0', fontSize: '16px', fontWeight: 600 }}>Ranked Choice Voting</h2>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '16px' }}>
                {rankedProposals.slice(0, 5).map((item, idx) => (
                  <div key={idx} style={{
                    background: '#0f0f0f', border: '1px solid #333',
                    borderRadius: '6px', padding: '16px',
                  }}>
                    <div style={{ fontSize: '24px', fontWeight: 600, color: '#d4504f', marginBottom: '12px' }}>
                      #{idx + 1}
                    </div>
                    <div style={{ fontSize: '13px', lineHeight: 1.6, marginBottom: '12px' }}>{item.proposal}</div>
                    <div style={{ fontSize: '12px', color: '#999' }}>
                      Support: <strong style={{ color: '#e0e0e0' }}>{item.score}</strong> pts
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {showConflictMap && conflictData.length > 0 && (
            <div style={{
              background: '#1a1a1a', border: '1px solid #333',
              borderRadius: '8px', padding: '24px', marginBottom: '24px',
            }}>
              <h2 style={{ margin: '0 0 16px 0', fontSize: '16px', fontWeight: 600 }}>Conflict Map</h2>
              <div style={{ display: 'grid', gap: '12px' }}>
                {conflictData.map((c, idx) => (
                  <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '4px' }}>
                        <span style={{ fontSize: '11px', fontWeight: 600 }}>{c.agent1.name}</span>
                        <div style={{ flex: 1, height: '3px', background: '#333', borderRadius: '2px' }}>
                          <div style={{
                            height: '100%', width: `${(parseFloat(c.delta) / 10) * 100}%`,
                            background: '#d4504f', borderRadius: '2px',
                          }} />
                        </div>
                        <span style={{ fontSize: '11px', fontWeight: 600 }}>{c.agent2.name}</span>
                      </div>
                      <div style={{ fontSize: '10px', color: '#999' }}>Δ {c.delta}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {showDeliberation && (
            <div style={{ marginBottom: '24px' }}>
              <h2 style={{ margin: '0 0 16px 0', fontSize: '16px', fontWeight: 600 }}>Full Deliberation</h2>
              <div style={{ display: 'grid', gap: '12px' }}>
                {evaluations.map((e) => {
                  const agent = AGENTS.find((a) => a.id === e.agentId) || { name: e.name, icon: '❔' };
                  return (
                    <details key={e.agentId} style={{
                      background: '#1a1a1a', border: '1px solid #333',
                      borderRadius: '6px', padding: '16px', cursor: 'pointer',
                    }}>
                      <summary style={{ fontWeight: 600, userSelect: 'none', color: '#d4504f' }}>
                        {agent.icon} {agent.name}
                      </summary>
                      <div style={{
                        marginTop: '12px', fontSize: '12px', lineHeight: 1.6,
                        color: '#ccc', whiteSpace: 'pre-wrap', fontFamily: 'monospace',
                      }}>{e.response || '(no response)'}</div>
                    </details>
                  );
                })}
              </div>
            </div>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DesignReviewApp />);
