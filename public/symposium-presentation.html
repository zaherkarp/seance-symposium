<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Symposium — Curated Verdict</title>
<style>
  :root {
    --bg: #0e0c0a;
    --ink: #f3ead8;
    --dim: #8a8170;
    --accent: #c9a96e;
    --red: #b85042;
    --blue: #6b8aa8;
    --rule: rgba(243, 234, 216, 0.12);
    --scene-dur: 10s;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif;
    overflow: hidden;
    cursor: pointer;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 10;
  }

  .progress {
    position: fixed; top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--rule);
    z-index: 20;
    display: flex;
    gap: 2px;
  }
  .progress .seg {
    flex: 1;
    background: rgba(243,234,216,0.1);
    position: relative;
    overflow: hidden;
  }
  .progress .seg.done::after,
  .progress .seg.active::after {
    content: "";
    position: absolute; inset: 0;
    background: var(--accent);
    transform-origin: left;
  }
  .progress .seg.done::after { transform: scaleX(1); }
  .progress .seg.active::after {
    transform: scaleX(0);
    animation: fill var(--scene-dur) linear forwards;
  }
  @keyframes fill { to { transform: scaleX(1); } }

  .stage { position: relative; width: 100%; height: 100%; }
  .scene {
    position: absolute; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
    padding: 5vh 6vw;
  }
  .scene.live { opacity: 1; pointer-events: auto; }

  .ctl {
    position: fixed; bottom: 1.5rem; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 1.5rem;
    z-index: 20;
    font-family: "Inter", system-ui, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .ctl button {
    background: none; border: 1px solid var(--rule); color: var(--dim);
    padding: 0.4rem 0.9rem; cursor: pointer; letter-spacing: inherit;
    font-size: inherit; text-transform: inherit; font-family: inherit;
  }
  .ctl button:hover { color: var(--ink); border-color: var(--accent); }
  .counter { min-width: 5rem; text-align: center; }


  .source-tag {
    position: fixed;
    top: 1rem; left: 1.5rem;
    font-family: "Inter", system-ui, sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--dim);
    text-transform: uppercase;
    z-index: 20;
  }
  .source-tag.live { color: var(--accent); }

  /* TITLE */
  .s-title { flex-direction: column; text-align: center; }
  .s-title .kicker {
    font-family: "Inter", system-ui, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.5em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 2rem;
    opacity: 0; animation: rise 1.4s ease 0.3s forwards;
  }
  .s-title h1 {
    font-size: clamp(3rem, 9vw, 7rem);
    font-weight: 400; font-style: italic; line-height: 1;
    margin-bottom: 2rem;
    opacity: 0; animation: rise 1.6s ease 0.8s forwards;
  }
  .s-title .sub {
    font-size: 1.1rem; color: var(--dim); font-style: italic;
    opacity: 0; animation: rise 1.4s ease 1.8s forwards;
  }
  .s-title .target {
    margin-top: 3rem;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.85rem; color: var(--ink);
    opacity: 0; animation: rise 1.4s ease 2.6s forwards;
    border: 1px solid var(--rule); padding: 0.6rem 1.2rem;
    max-width: 80vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* VERDICT */
  .s-verdict { flex-direction: column; text-align: center; }
  .s-verdict .label {
    font-family: "Inter", system-ui, sans-serif;
    font-size: 0.7rem; letter-spacing: 0.4em;
    color: var(--dim); text-transform: uppercase; margin-bottom: 1.5rem;
  }
  .s-verdict .score {
    font-size: clamp(8rem, 22vw, 18rem);
    font-weight: 300; line-height: 0.9;
    color: var(--accent); font-feature-settings: "tnum";
  }
  .s-verdict .denom { color: var(--dim); font-size: 0.4em; vertical-align: super; margin-left: 0.2em; }
  .s-verdict .tagline {
    font-style: italic; font-size: clamp(1.2rem, 2vw, 1.6rem);
    max-width: 50ch; color: var(--ink); line-height: 1.4; margin-top: 2rem;
    opacity: 0; animation: rise 1.5s ease 1.8s forwards;
  }
  .s-verdict .breakdown {
    display: flex; gap: 1.5rem; margin-top: 2.5rem;
    font-family: "Inter", system-ui, sans-serif;
    font-size: 0.75rem; color: var(--dim);
    opacity: 0; animation: rise 1.5s ease 2.4s forwards;
  }
  .s-verdict .breakdown b { color: var(--ink); font-weight: 500; }

  /* DEBATE */
  .s-debate { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; padding: 0; }
  .side {
    padding: 6vh 5vw;
    display: flex; flex-direction: column; justify-content: center; position: relative;
  }
  .side.left { background: linear-gradient(135deg, rgba(184,80,66,0.08), transparent); }
  .side.right { background: linear-gradient(225deg, rgba(107,138,168,0.08), transparent); }
  .side .who {
    font-family: "Inter", system-ui, sans-serif;
    font-size: 0.7rem; letter-spacing: 0.35em; text-transform: uppercase;
    margin-bottom: 1rem;
    opacity: 0; animation: rise 1s ease 0.4s forwards;
  }
  .side.left .who { color: var(--red); }
  .side.right .who { color: var(--blue); }
  .side .name {
    font-size: clamp(2.2rem, 4vw, 3.5rem); font-weight: 400; line-height: 1.05;
    margin-bottom: 0.8rem;
    opacity: 0; animation: rise 1.2s ease 0.7s forwards;
  }
  .side .phil {
    font-style: italic; color: var(--dim); margin-bottom: 2rem; font-size: 1rem;
    opacity: 0; animation: rise 1.2s ease 1.1s forwards;
  }
  .side .quote {
    font-size: clamp(1rem, 1.4vw, 1.3rem); line-height: 1.5;
    font-style: italic;
    border-left: 2px solid;
    padding-left: 1.2rem;
    margin-bottom: 2rem;
    max-height: 38vh; overflow: hidden;
    opacity: 0; animation: rise 1.4s ease 1.6s forwards;
  }
  .side.left .quote { border-color: var(--red); }
  .side.right .quote { border-color: var(--blue); }
  .side .meter {
    margin-top: auto;
    font-family: "Inter", system-ui, sans-serif;
    font-size: 0.75rem; letter-spacing: 0.15em; color: var(--dim);
    display: flex; align-items: baseline; gap: 0.8rem;
    opacity: 0; animation: rise 1.2s ease 2.2s forwards;
  }
  .side .meter b {
    font-family: "Cormorant Garamond", serif;
    font-size: 2.5rem; font-weight: 400; color: var(--ink);
  }
  .divider { width: 1px; background: var(--rule); position: relative; }
  .divider .vs {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg); padding: 0.8rem 0;
    font-family: "Inter", system-ui, sans-serif;
    font-size: 0.65rem; letter-spacing: 0.4em;
    color: var(--accent); writing-mode: vertical-rl;
    text-transform: uppercase;
  }
  .consensus-q {
    position: absolute; bottom: 6vh; left: 50%;
    transform: translateX(-50%);
    text-align: center; font-style: italic; color: var(--dim);
    font-size: 0.95rem; max-width: 60ch; padding: 0 2rem;
    opacity: 0; animation: rise 1.2s ease 2.8s forwards;
  }
  .consensus-q::before {
    content: "Consensus question — ";
    color: var(--accent); font-style: normal;
    font-family: "Inter", sans-serif;
    font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase;
  }

  /* PROPOSALS */
  .s-proposals { flex-direction: column; align-items: stretch; }
  .s-proposals .head { text-align: center; margin-bottom: 3rem; }
  .s-proposals .head .label {
    font-family: "Inter", sans-serif;
    font-size: 0.7rem; letter-spacing: 0.4em;
    color: var(--dim); text-transform: uppercase; margin-bottom: 0.6rem;
  }
  .s-proposals .head h2 {
    font-size: clamp(2rem, 4vw, 3rem); font-weight: 400; font-style: italic;
  }
  .props {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem; max-width: 1200px; margin: 0 auto; width: 100%;
  }
  .prop {
    border: 1px solid var(--rule); padding: 2rem 1.8rem;
    position: relative; opacity: 0; transform: translateY(30px);
    background: rgba(243,234,216,0.02);
  }
  .scene.live .prop { animation: rise 1.2s ease forwards; }
  .scene.live .prop:nth-child(1) { animation-delay: 0.4s; }
  .scene.live .prop:nth-child(2) { animation-delay: 0.9s; }
  .scene.live .prop:nth-child(3) { animation-delay: 1.4s; }
  .prop .rank {
    font-size: 4rem; font-weight: 300; color: var(--accent); line-height: 1;
    font-family: "Cormorant Garamond", serif;
  }
  .prop .v {
    font-family: "Inter", sans-serif;
    font-size: 0.65rem; letter-spacing: 0.3em; color: var(--dim);
    text-transform: uppercase; margin: 0.6rem 0 1.2rem 0;
  }
  .prop .text { font-size: 1.05rem; line-height: 1.45; color: var(--ink); }
  .prop .backers {
    margin-top: 1.5rem;
    font-family: "Inter", sans-serif;
    font-size: 0.7rem; color: var(--dim);
  }
  .prop .backers b { color: var(--accent); font-weight: 500; }

  /* MAP */
  .s-map { flex-direction: column; }
  .s-map .label {
    font-family: "Inter", sans-serif;
    font-size: 0.7rem; letter-spacing: 0.4em;
    color: var(--dim); text-transform: uppercase;
    margin-bottom: 0.5rem; text-align: center;
  }
  .s-map h2 {
    font-size: clamp(2rem, 4vw, 3rem); font-weight: 400; font-style: italic;
    text-align: center; margin-bottom: 2rem;
  }
  .s-map svg { width: min(900px, 90vw); height: 55vh; margin: 0 auto; }
  .s-map .caption {
    text-align: center; margin-top: 1.5rem; color: var(--dim);
    font-style: italic; max-width: 60ch; margin-left: auto; margin-right: auto;
  }
  .edge { stroke-dasharray: 4 4; opacity: 0; }
  .scene.live .edge { animation: edgeIn 1s ease forwards; }
  @keyframes edgeIn { to { opacity: 0.5; } }
  .node text { font-family: "Cormorant Garamond", serif; font-size: 14px; fill: var(--ink); }
  .node .role {
    font-family: "Inter", sans-serif; font-size: 9px;
    fill: var(--dim); letter-spacing: 0.15em; text-transform: uppercase;
  }

  /* GROUPS DIGEST */
  .s-groups { flex-direction: column; padding: 4vh 4vw; }
  .s-groups .head { text-align: center; margin-bottom: 1.5rem; flex-shrink: 0; }
  .s-groups .head .label {
    font-family: "Inter", sans-serif;
    font-size: 0.7rem; letter-spacing: 0.4em;
    color: var(--dim); text-transform: uppercase; margin-bottom: 0.5rem;
  }
  .s-groups .head h2 {
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 400; font-style: italic;
  }
  .g-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.9rem;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    overflow-y: auto;
    max-height: 60vh;
    padding: 0.5rem;
  }
  .group-card {
    border: 1px solid var(--rule);
    padding: 0.9rem 1rem;
    background: rgba(243,234,216,0.025);
    opacity: 0; transform: translateY(15px);
    display: flex; flex-direction: column; gap: 0.4rem;
  }
  .scene.live .group-card { animation: rise 0.7s ease forwards; }
  .group-card .g-head-row {
    display: flex; align-items: center; gap: 0.5rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.4rem; margin-bottom: 0.2rem;
  }
  .group-card .g-icon { font-size: 1.1rem; }
  .group-card .g-name {
    font-family: "Inter", sans-serif;
    font-size: 0.65rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent);
    font-weight: 500;
  }
  .group-card .g-take {
    font-size: 0.88rem; line-height: 1.4;
    font-style: italic; color: var(--ink);
  }
  .s-groups .g-caption {
    flex-shrink: 0;
    text-align: center; margin-top: 1rem;
    color: var(--dim); font-style: italic;
    font-size: 0.85rem;
  }

  /* SYNTH */
  .s-synth { flex-direction: column; text-align: center; max-width: 70ch; margin: 0 auto; }
  .s-synth .label {
    font-family: "Inter", sans-serif;
    font-size: 0.7rem; letter-spacing: 0.4em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 2rem;
  }
  .s-synth h2 {
    font-size: clamp(2rem, 4vw, 3rem); font-weight: 400; font-style: italic;
    line-height: 1.2; margin-bottom: 2rem;
  }
  .s-synth .actions { text-align: left; margin-top: 1rem; }
  .s-synth .action {
    border-top: 1px solid var(--rule);
    padding: 1.2rem 0;
    display: flex; gap: 1.5rem;
    opacity: 0;
  }
  .scene.live .action { animation: rise 1s ease forwards; }
  .scene.live .action:nth-child(1) { animation-delay: 0.6s; }
  .scene.live .action:nth-child(2) { animation-delay: 1.0s; }
  .scene.live .action:nth-child(3) { animation-delay: 1.4s; }
  .scene.live .action:nth-child(4) { animation-delay: 1.8s; }
  .action .n {
    font-family: "Cormorant Garamond", serif;
    color: var(--accent); font-size: 1.5rem; min-width: 2rem;
  }
  .action .t { font-size: 1.05rem; line-height: 1.5; }
  .s-synth .outro {
    margin-top: 3rem; font-style: italic; color: var(--dim);
    opacity: 0; animation: rise 1.2s ease 2.8s forwards;
  }
  .s-synth .refs {
    margin-top: 1.5rem;
    display: flex; justify-content: center; gap: 1.2rem; flex-wrap: wrap;
    font-family: "Inter", sans-serif;
    font-size: 0.7rem; letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0; animation: rise 1.2s ease 3.4s forwards;
  }
  .s-synth .refs .ref-label {
    color: var(--dim);
  }
  .s-synth .refs a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
    pointer-events: auto;
  }
  .s-synth .refs a:hover { color: var(--ink); border-color: var(--accent); }

  /* Title-scene target link */
  .s-title .target a {
    color: inherit;
    text-decoration: none;
    pointer-events: auto;
  }
  .s-title .target a:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="source-tag" id="source-tag">Demo data</div>
<div class="progress" id="progress"></div>
<div class="stage" id="stage"></div>

<div class="ctl">
  <button id="prev">◂ Back</button>
  <button id="pause">Pause</button>
  <span class="counter"><span id="cur">1</span> / <span id="total">—</span></span>
  <button id="next">Next ▸</button>
  <button id="restart">Restart</button>
</div>

<script>
(function () {

  // ---------------- Fallback demo data (used when opened directly) ----------------
  const DEMO_DATA = {
    target: "github.com/zaherkarp/zaherkarp.github.io",
    composite: 31,
    compositeMax: 50,
    leadQuote: "The discipline is already mostly here. The remaining work is subtraction, not addition.",
    meta: { agents: 6, conflicts: 3, proposals: 7 },
    roster: [
      { id: "tufte",       icon: "📊", name: "Tufte",       score: 31 },
      { id: "rosling",     icon: "🎬", name: "Rosling",     score: 26 },
      { id: "bertin",      icon: "🧬", name: "Bertin",      score: 29 },
      { id: "few",         icon: "⚙️", name: "Few",         score: 34 },
      { id: "shneiderman", icon: "🎮", name: "Shneiderman", score: 38 },
      { id: "inclusive",   icon: "♿", name: "Inclusive",   score: 27 },
    ],
    debates: [
      {
        panel: "I · Minimalism vs. Narrative",
        left: { id: "tufte", name: "Edward Tufte", icon: "📊", philosophy: "Remove all non-essential ink.",
                quote: "Four interactive widgets on a portfolio risks becoming a demo reel — decoration disguised as data. The 900KB vendored O*NET engine is a red flag.",
                score: 31, scoreMax: 50 },
        right: { id: "rosling", name: "Hans Rosling", icon: "🎬", philosophy: "Engage audiences through story.",
                 quote: "This is a CV, not a story. Where is the arc? I want to feel the trajectory — not scroll past a static résumé and four toys.",
                 score: 26, scoreMax: 50 },
        consensusQ: "How can we tell a clear story without unnecessary decoration?",
      },
      {
        panel: "IV · Pragmatism vs. V · Exploration",
        left: { id: "few", name: "Stephen Few", icon: "⚙️", philosophy: "Business ROI & maintainability.",
                quote: "Does it work? Can you maintain it? Does it solve a real problem? Stop showing off — start shipping value.",
                score: 34, scoreMax: 50 },
        right: { id: "shneiderman", name: "Ben Shneiderman", icon: "🎮", philosophy: "User agency & direct manipulation.",
                 quote: "The interactive widgets are the point. Strip them and you've stripped the evidence of thinking. Give users handles to pull.",
                 score: 38, scoreMax: 50 },
        consensusQ: "Can the page be both restrained and genuinely interactive?",
      },
      {
        panel: "II · Rigor vs. VI · Inclusion",
        left: { id: "bertin", name: "Jacques Bertin", icon: "🧬", philosophy: "Semiotic correctness & visual grammar.",
                quote: "The activity grid uses color without legend. The encoding is decorative — visual variables are inconsistently mapped across widgets.",
                score: 29, scoreMax: 50 },
        right: { id: "inclusive", name: "Inclusive Design", icon: "♿", philosophy: "Accessibility & cognitive load.",
                 quote: "A 900KB client library is a tax on slow connections and old devices. Reduction is not a luxury — it is an accessibility commitment.",
                 score: 27, scoreMax: 50 },
        consensusQ: "Whose mental model are we encoding for, and who pays the cost?",
      },
    ],
    topProposals: [
      { rank: 1, votes: 39, text: "Cut three of four interactive widgets from the index. Keep the one that best represents your thinking.",
        backers: [{ id: "tufte", name: "Tufte" }, { id: "few", name: "Few" }, { id: "bertin", name: "Bertin" }, { id: "inclusive", name: "Inclusive" }] },
      { rank: 2, votes: 31, text: "Lazy-load or relocate the 900KB skillsprout client. No homepage visitor should download a megabyte of O*NET to read your name.",
        backers: [{ id: "tufte", name: "Tufte" }, { id: "few", name: "Few" }, { id: "inclusive", name: "Inclusive" }, { id: "rosling", name: "Rosling" }] },
      { rank: 3, votes: 24, text: "Enforce a single typographic hierarchy above the fold: name, one sentence, links. Three sizes maximum.",
        backers: [{ id: "tufte", name: "Tufte" }, { id: "bertin", name: "Bertin" }, { id: "shneiderman", name: "Shneiderman" }] },
    ],
    conflicts: [
      { left: { id: "tufte", name: "Tufte", role: "Minimalism" }, right: { id: "rosling", name: "Rosling", role: "Narrative" }, delta: 1.0 },
      { left: { id: "few", name: "Few", role: "Pragmatism" }, right: { id: "shneiderman", name: "Shneiderman", role: "Exploration" }, delta: 4.0 },
      { left: { id: "bertin", name: "Bertin", role: "Rigor" }, right: { id: "inclusive", name: "Inclusive", role: "Inclusion" }, delta: 0.4 },
    ],
    synthesis: {
      title: "Subtraction, not addition.",
      actions: [
        "Choose ONE widget. The others become linked artifacts, not homepage furniture.",
        "Move the O*NET client behind an explicit click. Homepage stays under 200KB.",
        "Above the fold: name, one sentence, three links. Three type sizes maximum.",
        "Print-test the page. If the printout is a respectable one-pager, the screen is calibrated.",
      ],
    },
    groupSummaries: [
      { id: "tufte", icon: "📊", name: "Tufte",
        discipline: "minimalism and information design",
        take: "The site over-indexes on interactive proof-of-skill at the cost of static legibility — the work would carry itself if the chrome stepped back." },
      { id: "rosling", icon: "🎬", name: "Rosling",
        discipline: "narrative data storytelling",
        take: "A portfolio without arc is a transcript, not a story — the widgets are evidence in search of a thesis." },
      { id: "few", icon: "⚙️", name: "Few",
        discipline: "pragmatic business analytics",
        take: "Ship-ready in structure but pre-launch in discipline — the megabyte client and four widgets are luxury, not feature." },
      { id: "shneiderman", icon: "🎮", name: "Shneiderman",
        discipline: "human-computer interaction",
        take: "The interactive widgets are the point and should be celebrated, not cut — they show this designer can ship working systems." },
      { id: "bertin", icon: "🧬", name: "Bertin",
        discipline: "semiotics and visual encoding",
        take: "The visual variables are loosely mapped across widgets — without a declared grammar, each toy is its own dialect." },
      { id: "inclusive", icon: "♿", name: "Inclusive Design",
        discipline: "inclusive and accessible design",
        take: "Reduction here is not just aesthetic — a 900KB client tax is an accessibility concession that should be reversed." },
    ],
    links: {
      source: "https://github.com/zaherkarp/zaherkarp.github.io",
      deliberation: "",
    },
  };

  // ---------------- Load data: localStorage > demo ----------------
  let data = DEMO_DATA;
  let isLive = false;
  try {
    const stored = localStorage.getItem("symposium-data");
    if (stored) {
      const parsed = JSON.parse(stored);
      if (parsed && parsed.debates && parsed.topProposals) {
        data = parsed;
        isLive = true;
      }
    }
  } catch (err) {
    console.warn("Failed to load symposium data, using demo:", err);
  }

  if (isLive) {
    const tag = document.getElementById("source-tag");
    tag.textContent = "Live evaluation";
    tag.classList.add("live");
  }

  // ---------------- Helpers ----------------
  const escape = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
  );

  function buildTitleScene() {
    let targetHtml = "";
    if (data.target) {
      const sourceUrl = data.links?.source;
      const t = escape(data.target);
      targetHtml = sourceUrl
        ? `<div class="target"><a href="${escape(sourceUrl)}" target="_blank" rel="noopener">${t} ↗</a></div>`
        : `<div class="target">${t}</div>`;
    }
    return `
      <section class="scene s-title">
        <div class="kicker">The Symposium</div>
        <h1>has convened.</h1>
        <div class="sub">${escape(data.meta.agents)} voices. ${escape(data.debates.length)} debates. One verdict.</div>
        ${targetHtml}
      </section>`;
  }

  function buildVerdictScene() {
    return `
      <section class="scene s-verdict">
        <div class="label">Composite verdict</div>
        <div class="score" id="score">0<span class="denom">/${escape(data.compositeMax)}</span></div>
        <div class="tagline">"${escape(data.leadQuote)}"</div>
        <div class="breakdown">
          <span><b>${escape(data.meta.agents)}</b> agents convened</span>
          <span>·</span>
          <span><b>${escape(data.meta.conflicts)}</b> active conflicts</span>
          <span>·</span>
          <span><b>${escape(data.meta.proposals)}</b> proposals surfaced</span>
        </div>
      </section>`;
  }

  function buildDebateScene(d) {
    return `
      <section class="scene s-debate">
        <div class="side left">
          <div class="who">${escape(d.left.icon || "")} Panel ${escape(d.panel)}</div>
          <div class="name">${escape(d.left.name)}</div>
          <div class="phil">${escape(d.left.philosophy || "")}</div>
          <div class="quote">"${escape(d.left.quote)}"</div>
          <div class="meter">Score <b>${d.left.score !== null && d.left.score !== undefined ? escape(d.left.score) : "—"}</b>/${escape(d.left.scoreMax || 50)}</div>
        </div>
        <div class="divider"><div class="vs">vs.</div></div>
        <div class="side right">
          <div class="who">${escape(d.right.icon || "")} ${escape(d.right.name)}</div>
          <div class="name">${escape(d.right.name)}</div>
          <div class="phil">${escape(d.right.philosophy || "")}</div>
          <div class="quote">"${escape(d.right.quote)}"</div>
          <div class="meter">Score <b>${d.right.score !== null && d.right.score !== undefined ? escape(d.right.score) : "—"}</b>/${escape(d.right.scoreMax || 50)}</div>
        </div>
        <div class="consensus-q">${escape(d.consensusQ || "")}</div>
      </section>`;
  }

  function backerNames(backers) {
    if (!Array.isArray(backers) || backers.length === 0) return [];
    return backers.map((b) => (typeof b === "string" ? b : b.name)).filter(Boolean);
  }

  function backerIds(backers) {
    if (!Array.isArray(backers) || backers.length === 0) return [];
    return backers.map((b) => (typeof b === "object" && b ? b.id : null)).filter(Boolean);
  }

  function buildProposalsScene() {
    const cards = data.topProposals.slice(0, 3).map((p) => {
      const names = backerNames(p.backers);
      return `
        <div class="prop">
          <div class="rank">${String(p.rank).padStart(2, "0")}</div>
          <div class="v">${escape(p.votes)} votes</div>
          <div class="text">${escape(p.text)}</div>
          ${names.length ? `<div class="backers">Backed by <b>${names.map(escape).join(" · ")}</b></div>` : ""}
        </div>`;
    }).join("");
    return `
      <section class="scene s-proposals">
        <div class="head">
          <div class="label">Ranked Choice · Aggregate Proposals</div>
          <h2>What the room agreed on.</h2>
        </div>
        <div class="props">${cards}</div>
      </section>`;
  }

  function buildMapScene() {
    const conflicts = (data.conflicts || []).slice(0, 4);
    if (!conflicts.length) {
      return `
        <section class="scene s-map">
          <div class="label">Productive friction</div>
          <h2>The room was uncommonly aligned.</h2>
          <div class="caption" style="margin-top:4rem;">No major conflicts surfaced in this round.</div>
        </section>`;
    }
    const rows = conflicts.length;
    const height = 400;
    const step = height / (rows + 1);
    const maxDelta = Math.max(...conflicts.map((c) => parseFloat(c.delta) || 0), 1);
    let edges = "";
    let nodes = "";
    conflicts.forEach((c, i) => {
      const y = step * (i + 1);
      const dval = parseFloat(c.delta) || 0;
      const w = 0.8 + (dval / maxDelta) * 2.5;
      const color = i === 0 ? "var(--blue)" : "var(--red)";
      edges += `<line class="edge" x1="160" y1="${y}" x2="640" y2="${y}" stroke="${color}" stroke-width="${w.toFixed(2)}" style="animation-delay:${0.4 + i * 0.3}s"/>`;
      nodes += `
        <g class="node">
          <circle cx="160" cy="${y}" r="${8 + Math.min(4, dval)}" fill="var(--red)"/>
          <text x="140" y="${y + 5}" text-anchor="end">${escape(c.left.name)}</text>
          <text class="role" x="140" y="${y + 20}" text-anchor="end">${escape(c.left.role || "")}</text>
        </g>
        <g class="node">
          <circle cx="640" cy="${y}" r="${8 + Math.min(4, dval)}" fill="var(--blue)"/>
          <text x="660" y="${y + 5}">${escape(c.right.name)}</text>
          <text class="role" x="660" y="${y + 20}">${escape(c.right.role || "")}</text>
        </g>`;
    });
    const sharp = conflicts[0];
    return `
      <section class="scene s-map">
        <div class="label">Productive friction</div>
        <h2>Where the room disagreed.</h2>
        <svg viewBox="0 0 800 ${height}" preserveAspectRatio="xMidYMid meet">
          ${edges}
          ${nodes}
        </svg>
        <div class="caption">${escape(sharp.left.name)} vs. ${escape(sharp.right.name)} produced the sharpest disagreement — a Δ ${escape(sharp.delta)} gap.</div>
      </section>`;
  }

  function buildGroupsScene() {
    const groups = (data.groupSummaries || []).filter((g) => g && g.take);
    if (!groups.length) return "";
    const cards = groups.map((g, idx) => {
      const delay = 0.25 + idx * 0.07;
      return `
        <div class="group-card" style="animation-delay:${delay.toFixed(2)}s">
          <div class="g-head-row">
            <div class="g-icon">${escape(g.icon || "🎓")}</div>
            <div class="g-name">${escape(g.name || "")}</div>
          </div>
          <div class="g-take">"${escape(g.take)}"</div>
        </div>`;
    }).join("");
    return `
      <section class="scene s-groups">
        <div class="head">
          <div class="label">Disciplinary Digest</div>
          <h2>${escape(groups.length)} groups weighed in.</h2>
        </div>
        <div class="g-grid">${cards}</div>
        <div class="g-caption">Each group read every critic, then argued their own discipline's verdict.</div>
      </section>`;
  }

  function buildSynthScene() {
    const actions = (data.synthesis.actions || []).slice(0, 4).map((a, i) => `
      <div class="action"><div class="n">${String(i + 1).padStart(2, "0")}</div><div class="t">${escape(a)}</div></div>
    `).join("");

    const refLinks = [];
    if (data.links?.source) {
      refLinks.push(`<a href="${escape(data.links.source)}" target="_blank" rel="noopener">📁 Source artifact ↗</a>`);
    }
    if (data.links?.deliberation) {
      refLinks.push(`<a href="${escape(data.links.deliberation)}" rel="noopener">↩ Return to deliberation</a>`);
    } else if (window.opener) {
      refLinks.push(`<a href="javascript:void(0)" onclick="window.close()">↩ Close presentation</a>`);
    }
    const refsHtml = refLinks.length
      ? `<div class="refs"><span class="ref-label">References —</span>${refLinks.join(" · ")}</div>`
      : "";

    return `
      <section class="scene s-synth">
        <div class="label">Synthesis · Next iteration</div>
        <h2>"${escape(data.synthesis.title)}"</h2>
        <div class="actions">${actions}</div>
        <div class="outro">— The Symposium adjourns.</div>
        ${refsHtml}
      </section>`;
  }

  // ---------------- Compose stage ----------------
  const stage = document.getElementById("stage");
  const sceneHtml = [
    buildTitleScene(),
    buildVerdictScene(),
    ...data.debates.map(buildDebateScene),
    buildProposalsScene(),
    buildMapScene(),
    buildGroupsScene(),
    buildSynthScene(),
  ].filter(Boolean);
  stage.innerHTML = sceneHtml.join("");

  const scenes = Array.from(stage.querySelectorAll(".scene"));
  const total = scenes.length;
  const sceneDurMs = 10000;
  let i = 0, timer = null, paused = false;

  const progress = document.getElementById("progress");
  scenes.forEach(() => {
    const s = document.createElement("div");
    s.className = "seg";
    progress.appendChild(s);
  });
  const segs = Array.from(progress.children);
  document.getElementById("total").textContent = total;

  function paintProgress() {
    segs.forEach((s, idx) => {
      s.classList.remove("done", "active");
      if (idx < i) s.classList.add("done");
      else if (idx === i) s.classList.add("active");
    });
    const seg = segs[i];
    if (seg) {
      seg.classList.remove("active");
      void seg.offsetWidth;
      seg.classList.add("active");
    }
  }

  function showScene(n) {
    i = ((n % total) + total) % total;
    scenes.forEach((el, idx) => el.classList.toggle("live", idx === i));
    document.getElementById("cur").textContent = i + 1;
    paintProgress();
    if (scenes[i].classList.contains("s-verdict")) animateScore();
    scheduleNext();
  }

  function scheduleNext() {
    clearTimeout(timer);
    if (paused) return;
    timer = setTimeout(() => showScene(i + 1), sceneDurMs);
  }

  function animateScore() {
    const el = document.getElementById("score");
    if (!el) return;
    const target = Number(data.composite) || 0;
    const max = data.compositeMax || 50;
    let n = 0;
    const stepSize = Math.max(1, Math.ceil(target / 30));
    const step = () => {
      n = Math.min(target, n + stepSize);
      el.innerHTML = n + `<span class="denom">/${max}</span>`;
      if (n < target) setTimeout(step, 50);
    };
    el.innerHTML = `0<span class="denom">/${max}</span>`;
    setTimeout(step, 400);
  }

  document.getElementById("next").addEventListener("click", e => { e.stopPropagation(); showScene(i + 1); });
  document.getElementById("prev").addEventListener("click", e => { e.stopPropagation(); showScene(i - 1); });
  document.getElementById("restart").addEventListener("click", e => { e.stopPropagation(); showScene(0); });
  document.getElementById("pause").addEventListener("click", e => {
    e.stopPropagation();
    paused = !paused;
    e.target.textContent = paused ? "Play" : "Pause";
    if (paused) clearTimeout(timer); else scheduleNext();
  });

  document.body.addEventListener("click", () => showScene(i + 1));
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); showScene(i + 1); }
    if (e.key === "ArrowLeft") showScene(i - 1);
    if (e.key === "Escape") {
      paused = !paused;
      document.getElementById("pause").textContent = paused ? "Play" : "Pause";
      if (paused) clearTimeout(timer); else scheduleNext();
    }
  });

  showScene(0);
})();
</script>
</body>
</html>
